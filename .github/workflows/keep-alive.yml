name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -s -o /dev/null -w "HTTP status: %{http_code}\n" \
            "https://risk-assessment-worker-survey-tnyubhgo58tkuvbqwsgvps.streamlit.app/"
