name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app (trigger wake-up, then confirm)
        run: |
          URL="https://risk-assessment-worker-survey-tnyubhgo58tkuvbqwsgvps.streamlit.app/"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          curl -sL -A "$UA" -o /dev/null -w "1st hit: %{http_code}\n" "$URL"
          sleep 60
          curl -sL -A "$UA" -o /dev/null -w "2nd hit: %{http_code}\n" "$URL"
